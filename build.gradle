plugins {
    id 'java'
}

group = 'net.kallen.solaris'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

project.ext.lwjglVersion = "3.4.1"

def os = org.gradle.internal.os.OperatingSystem.current()
def arch = System.getProperty("os.arch")
if (os.isLinux()) {
    project.ext.lwjglNatives = (arch.startsWith("arm") || arch.startsWith("aarch64")) ? "natives-linux-arm64" : "natives-linux"
} else if (os.isMacOsX()) {
    project.ext.lwjglNatives = arch.startsWith("aarch64") ? "natives-macos-arm64" : "natives-macos"
} else {
    project.ext.lwjglNatives = "natives-windows"
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")

    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-stb"

    runtimeOnly "org.lwjgl:lwjgl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-glfw::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-opengl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-stb::${lwjglNatives}"

    implementation "com.google.code.gson:gson:2.14.0"
    testImplementation 'junit:junit:4.13.2'
}

test {
    useJUnit()
}


tasks.register('runCubeDemo', JavaExec) {
    group = 'demo'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.kallen.solaris.demo.CubeDemo'
}

tasks.register('runFirstStepDemo', JavaExec) {
    group = 'demo'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.kallen.solaris.demo.FirstStepDemo'
}




tasks.register('BezierExample', JavaExec) {
    group = 'example'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.kallen.solaris.example.BezierExample'
}

tasks.register('SieveExample', JavaExec) {
    group = 'example'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.kallen.solaris.example.SieveExample'
}

tasks.register('QuadTreeExample', JavaExec) {
    group = 'example'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.kallen.solaris.example.QuadTreeExample'
}
